[package]
name = "seo-plugin"
description = "rBrowser's first-party SEO check: the raw response, the raw HTML and the rendered DOM held to the essentials (RB-060-08)"
# The plugin's own version (manifest.toml, CHANGES.md), not the workspace's.
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

# A crate of its own, outside the app's workspace, like the SDK templates: scripts/build-plugins.sh
# builds it in this folder for wasm32 and `cargo test` here runs its logic natively.
[workspace]

# The native side of the contract (`Check`, `Feature`, `PluginHost`); it builds for wasm32 too.
# The guest binding (src/guest.rs) needs wit-bindgen on wasm32 only, against
# `crates/rb-plugin-api/wit`, so the native build neither builds nor links it.
[dependencies]
rb-plugin-api = { path = "../../crates/rb-plugin-api" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The raw and the rendered HTML: html5ever's tree and CSS selectors, in pure Rust (ISC).
scraper = { version = "0.29.0", default-features = false }
# scraper's tree, named for the sibling walk of the alt text rules (the version scraper uses).
ego-tree = "0.11.1"
# The page's JSON-LD, Microdata and RDFa readers and the rich-result table, shared with the
# structured data panel (RB-090-96).
schema-org = { path = "../schema-org" }
# The URL, robots.txt and base64 helpers, shared with plugins/sitemap-capture and
# plugins/pwa-check (RB-094-11).
plugin-util = { path = "../plugin-util" }
# The language of an alt text against the page's `lang` (MIT); trigram models, no data files.
whatlang = "0.18.0"
# The XML sitemaps and their `xhtml:link` alternates (RB-060-09): no DTD, a node limit (MIT/Apache-2.0),
# the version plugins/sitemap-capture uses.
roxmltree = "0.21.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63.0"

[dev-dependencies]
# `MemoryHost`: the native trait run against the host's rules, without WebAssembly.
rb-plugin-api = { path = "../../crates/rb-plugin-api", features = ["test-support"] }

[lib]
# `cdylib` is the core module `wasm-tools component new` turns into the component; `rlib` lets
# `cargo test` build the logic natively.
crate-type = ["cdylib", "rlib"]

# The app's workspace lints, repeated: this crate is no member of that workspace.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
opt-level = "s"
lto = true
strip = true
