[package]
name = "schema-org"
description = "The schema.org data of a page, read once for rBrowser's first-party plugins: JSON-LD, Microdata and RDFa extraction, the schema.org vocabulary and the rich-result table (RB-090-96)"
# The library's own version, not the workspace's; no plugin of its own (no manifest.toml).
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

# A crate of its own, outside the app's workspace, like the plugins that use it (plugins/seo,
# plugins/structured-data): a path dependency of each, built for wasm32 with them, and
# `cargo test` here runs its own tests natively (scripts/check.sh, plugin tests).
[workspace]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The raw and the rendered HTML: html5ever's tree and CSS selectors, in pure Rust (ISC); the
# version plugins/seo uses.
scraper = { version = "0.29.0", default-features = false }

[lib]
name = "schema_org"

# The app's workspace lints, repeated: this crate is no member of that workspace.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
