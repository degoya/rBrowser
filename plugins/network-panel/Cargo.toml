[package]
name = "network-panel-plugin"
description = "rBrowser's first-party network panel: the requests of every view with their differences, mocks, blocking and rewrites applied by the host, HAR export and import (RB-070-02)"
# The plugin's own version (manifest.toml, CHANGES.md), not the workspace's.
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

# A crate of its own, outside the app's workspace, like the SDK templates: scripts/build-plugins.sh
# builds it in this folder for wasm32 and `cargo test` here runs its logic natively.
[workspace]

[dependencies]
rb-plugin-api = { path = "../../crates/rb-plugin-api" }
# The masking of a saved session: the app's list of secret names (RB-080-37).
rb-util = { path = "../../crates/rb-util" }
serde_json = "1.0.154"
# HAR bodies and mock bodies travel as base64 (the version of the app's workspace).
base64 = "0.23.1"

# The guest binding (src/guest.rs) needs wit-bindgen on wasm32 only, against
# `crates/rb-plugin-api/wit`, so the native build neither builds nor links it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63.0"

[dev-dependencies]
# `MemoryHost`: the native traits run against the host's rules, without WebAssembly.
rb-plugin-api = { path = "../../crates/rb-plugin-api", features = ["test-support"] }

[lib]
name = "network_panel_plugin"
# `cdylib` is the core module `wasm-tools component new` turns into the component; `rlib` lets
# `cargo test` build the logic natively.
crate-type = ["cdylib", "rlib"]

# The app's workspace lints, repeated: this crate is no member of that workspace.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
opt-level = "s"
lto = true
strip = true
