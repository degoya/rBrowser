[package]
name = "live-css-plugin"
description = "rBrowser's first-party Live CSS: a CSS draft applied in every view at once, block by block in all views or chosen breakpoints, copied as media queries (RB-094-04)"
# The plugin's own version (manifest.toml, CHANGES.md), not the workspace's.
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

# A crate of its own, outside the app's workspace, like the SDK templates: scripts/build-plugins.sh
# builds it in this folder for wasm32 and `cargo test` here runs its logic natively.
[workspace]

[dependencies]
rb-plugin-api = { path = "../../crates/rb-plugin-api" }
serde_json = "1.0.154"

# The guest binding (src/guest.rs) needs wit-bindgen on wasm32 only, against
# `crates/rb-plugin-api/wit`, so the native build neither builds nor links it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63.0"

[dev-dependencies]
# The native tests run against their own host (src/testing.rs), which models workspace trust.
rb-plugin-api = { path = "../../crates/rb-plugin-api", features = ["test-support"] }

[lib]
name = "live_css_plugin"
# `cdylib` is the core module `wasm-tools component new` turns into the component; `rlib` lets
# `cargo test` build the logic natively.
crate-type = ["cdylib", "rlib"]

# The app's workspace lints, repeated: this crate is no member of that workspace.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
opt-level = "s"
lto = true
strip = true
