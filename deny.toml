[graph]
all-features = true
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]

[advisories]
yanked = "warn"
# Every ignored advisory names its reason and the condition under which it leaves the list.
ignore = [
    # chrono is unmaintained (no vulnerability, no fixed release). rBrowser's own use moved to
    # `time` (RB-090-77); rmcp still depends on it and switches on schemars' `chrono04`. Leaves
    # the list when rmcp and schemars no longer depend on chrono.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; transitive through rmcp and schemars, no safe upgrade" },
]

[licenses]
confidence-threshold = 0.8
# The list anticipates the dependencies of the coming crates (CEF, wasmtime, the web stack); an
# allowance nothing uses yet is no finding.
unused-allowed-license = "allow"
# Permissive licences and the copyleft ones GPL-3.0-or-later can take in. The CEF binaries
# (BSD-3-Clause) and Chromium's notices ship in the package's NOTICE, not through cargo.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  # bzip2's own BSD-style licence: libbz2-rs-sys, which the cef crate's build script uses to unpack
  # the CEF archive (build time only, nothing of it ships; RB-010-04).
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# A second version of a crate is a warning, not an error: each is a size question, not a security
# one, until a duplicated crypto crate shows up (reviewed in docs/security/).
multiple-versions = "warn"
# No `*` version anywhere; the workspace's own crates are path dependencies without a version,
# which is allowed because none of them is published (`publish = false` in every crate).
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
