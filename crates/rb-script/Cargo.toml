[package]
name = "rb-script"
description = "rBrowser's script sandbox for MCP code mode: the JavaScript engine component in wasmtime, no WASI, its one import the MCP tools, a memory limit and an epoch deadline per run (RB-098-01)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
wasmtime.workspace = true

[dev-dependencies]
# `tests/engine.rs` reads the engine's answers.
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# The test components are WebAssembly text made into components the way `wasm-tools component
# new` does (as rb-plugin-host's test bed), so the sandbox's limits are tested without the engine.
wat.workspace = true
wit-component.workspace = true
wit-parser.workspace = true

[lints]
workspace = true
