<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rBrowser Web Vitals fixture</title>
<style>
  /* RB-060-10: Web Vitals that differ by breakpoint.
     - LCP: below 768 px the mobile hero is the largest paint, above it the desktop hero. The
       heroes are busy SVGs: Chromium leaves low-entropy images (a flat colour) out of LCP.
     - CLS: 500 ms after the load a banner pushes the content down - shown only below 768 px, so
       only the narrow views shift (CLS above 0.25, "poor"); the wide ones stay at 0.
     - INP: the button blocks the main thread for 600 ms per click ("poor", above web.dev's
       500 ms); `?block=300` sets another time (300 ms rates "needs improvement").
     Open it in rBrowser with a mobile and a desktop breakpoint, or run
     `npm run test:e2e` in agent/. */
  body { margin: 0; font: 16px system-ui, sans-serif; }
  #banner { display: none; height: 320px; background: #ffd34d; }
  .hero { display: block; width: 100%; height: auto; }
  #hero-desktop { display: none; }
  @media (max-width: 767px) {
    #banner.show { display: block; }
  }
  @media (min-width: 768px) {
    #hero-mobile { display: none; }
    #hero-desktop { display: block; }
  }
  main { padding: 8px; }
  p { margin: 8px 0; }
</style>

<main>
  <p>Web Vitals differ by breakpoint: a banner shifts this text only in narrow views.</p>
  <button id="slow" type="button">Slow button</button>
  <p id="clicks">0 clicks</p>
</main>
<script>
  setTimeout(() => document.getElementById('banner').classList.add('show'), 500);
  const block = Number(new URLSearchParams(location.search).get('block') || 600);
  let clicks = 0;
  document.getElementById('slow').addEventListener('click', () => {
    const until = performance.now() + block;
    while (performance.now() < until) {
      // Busy: the interaction's next paint waits for this handler.
    }
    clicks += 1;
    document.getElementById('clicks').textContent = clicks + ' clicks';
  });
</script>
