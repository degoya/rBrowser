# SPDX-License-Identifier: MIT
# The CI workflow of an rBrowser plugin made from an SDK template: test the logic, build the
# component, refuse an import outside the contract, package it and run the conformance checks; a
# plugin with a Nuxt UI panel (web/) also builds and tests the panel.
# Copy it to `.github/workflows/plugin.yml` of your plugin's repository. The actions are pinned to
# commits with their release as a comment, as rBrowser's own workflows are
# (scripts/check-actions-pinned.sh); move them to the commits rBrowser's workflows use.
name: plugin

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The rBrowser release the plugin is checked against (scripts/set-version.sh keeps it at the
  # release the SDK comes with); its `rb-plugin-pack conformance` is the check to run once the
  # release ships the tool.
  RBROWSER_VERSION: 0.7.0
  # The crate's component name: the package name with `-` as `_`.
  COMPONENT: rbrowser_plugin_feature_example
  WASM_TOOLS_VERSION: 1.261.0
  # The Node release rBrowser's panel-ui is built with (rBrowser's .nvmrc).
  NODE_VERSION: 26.13.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is on the runner image; no third-party action needed for the toolchain.
      - name: Install Rust with the wasm32 target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Install wasm-tools
        run: cargo install wasm-tools --version "${WASM_TOOLS_VERSION}" --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('web/package.json') != ''
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build and test the panel
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
      - name: Test
        run: cargo test
      - name: Build the component
        run: |
          cargo build --release --target wasm32-unknown-unknown
          wasm-tools component new "target/wasm32-unknown-unknown/release/${COMPONENT}.wasm" \
            -o target/component.wasm
      - name: Reject imports outside the contract
        run: |
          imports="$(wasm-tools component wit target/component.wasm \
            | sed -n 's/^[[:space:]]*import[[:space:]]\{1,\}\([^;]*\);.*$/\1/p')"
          if printf '%s\n' "$imports" | grep -v '^rbrowser:plugin/' | grep -q .; then
            echo "imports outside rbrowser:plugin:"; printf '%s\n' "$imports"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component
          path: |
            target/component.wasm
            panel/dist/
