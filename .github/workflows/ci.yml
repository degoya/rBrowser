name: CI

# The checks of every push and pull request once the repository is on GitHub (RB-090-04, after
# rCommander's ci.yml; prepared, inactive until the move, RB-090-12). It runs the same scripts as
# a workstation: scripts/check.sh --preflight, --rust and --windows, scripts/build-plugins.sh,
# scripts/package-windows.sh and scripts/package-msi.sh. scripts/check.sh --full stays the local
# gate; this is the same gate on clean machines, Windows itself included.
on:
  # Branches only: a release tag has release.yml.
  push:
    branches: ["**"]
  pull_request:
  # A re-check of one fix need not wait for the platform it cannot affect:
  #   gh workflow run ci.yml --ref <branch> -f platforms=windows
  # macOS (the test build, RB-090-15) runs only when asked for by name - platforms=macos, not
  # part of `all`, so scripts/public-ci.sh's gates stay what they were - or on a push to a `ci/*`
  # branch: its runners are the costly ones.
  workflow_dispatch:
    inputs:
      platforms:
        description: The platforms whose jobs run (the preflight always runs)
        type: choice
        options: [all, linux, windows, macos]
        default: all

# Nothing by default; every job names what it needs, which is reading the tree. No job here sees
# a secret.
permissions: {}

# A newer push to the same branch makes the running one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental state is dead weight in a one-off build.
  CARGO_INCREMENTAL: 0
  # A runner runs one job: the build lock and the memory gate of scripts/lib/lock.sh are for a
  # shared workstation.
  RB_NO_LOCK: 1
  RB_MIN_FREE_MB: 0
  # The test profile with JUnit output and one retry (.config/nextest.toml).
  NEXTEST_PROFILE: ci

# Runner images are named, not `-latest`: a `-latest` label moves under a release without a
# commit. Actions are pinned to a commit with the release as a comment
# (scripts/check-actions-pinned.sh); dependabot.yml moves them.

jobs:
  # What needs no compiler: scripts/check.sh --preflight with shellcheck, gitleaks and actionlint
  # at their pins, cargo-deny against today's advisories and the npm builds and tests of the
  # front ends.
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install shellcheck, gitleaks and actionlint
        run: scripts/ci-tools.sh linters
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.20.2
      # The preflight's `cargo deny --offline check` reads the advisory database fetched here.
      - name: Fetch the advisory database
        run: cargo deny fetch
      - name: scripts/check.sh --preflight
        env:
          RB_CHECK_LOGS: ${{ runner.temp }}/check
        run: scripts/check.sh --preflight
      - name: Upload the check logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-logs
          path: ${{ runner.temp }}/check
          retention-days: 14

  # Clippy (-D warnings) and every test on Linux (scripts/check.sh --rust, the native app linked
  # against CEF among them), then the first-party plugins built for wasm32 as development
  # packages with their conformance check (scripts/build-plugins.sh --unsigned; no key on a CI
  # run), then the Linux x64 test package (RB-097-05): the tarball, the deb and the rpm
  # (scripts/package-linux.sh), the tarball's program started, the deb installed, started and
  # removed again. The packages stay a week as artifacts of the run.
  linux:
    needs: preflight
    if: inputs.platforms != 'windows' && inputs.platforms != 'macos'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # A hang is cut off rather than left running for six hours.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CEF's run-time libraries (the tests link libcef.so), Xvfb, strip, rsvg-convert.
      - name: Install the native Linux build's packages
        run: scripts/ci-tools.sh linux
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: linux
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest@0.9.151,wasm-tools@1.261.0
      - name: scripts/check.sh --rust
        env:
          RB_CHECK_LOGS: ${{ runner.temp }}/check
        run: scripts/check.sh --rust
      # Into artifacts/plugins/, which the package takes them from.
      - name: The plugins, unsigned, with their conformance check
        run: mkdir -p artifacts/plugins && scripts/build-plugins.sh --unsigned
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install nfpm (pinned)
        run: scripts/release-channels.sh install-nfpm
      # Builds the front ends it ships, then the app natively, and packs the tarball, the deb
      # and the rpm.
      - name: scripts/package-linux.sh --profile release-test --deb --rpm
        run: scripts/package-linux.sh --profile release-test --plugins artifacts/plugins --deb --rpm
      # The tarball's program answers without a display; the deb installs with chrome-sandbox
      # root's and setuid, its program answers, and its removal leaves no folder behind.
      - name: The package smoke
        run: |
          set -euo pipefail
          tarballs=(artifacts/linux/rbrowser-*-linux-x64.tar.gz)
          debs=(artifacts/linux/rbrowser-*-linux-x64.deb)
          name="$(basename "${tarballs[0]}" .tar.gz)"
          mkdir -p "${RUNNER_TEMP}/unpacked"
          tar -xzf "${tarballs[0]}" -C "${RUNNER_TEMP}/unpacked"
          "${RUNNER_TEMP}/unpacked/${name}/rbrowser" --version
          sudo apt-get install -y -q "./${debs[0]}"
          test -u /usr/lib/rbrowser/chrome-sandbox
          test "$(stat -c %U /usr/lib/rbrowser/chrome-sandbox)" = root
          test -f /usr/share/applications/rbrowser.desktop
          test "$(cat /usr/lib/rbrowser/install-kind)" = deb
          rbrowser --version
          sudo apt-get remove -y -q rbrowser
          test ! -e /usr/lib/rbrowser
          test ! -e /usr/bin/rbrowser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64-release-test
          path: |
            artifacts/linux/*.tar.gz
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
          if-no-files-found: error
          retention-days: 7
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-linux
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the check logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-check-logs
          path: ${{ runner.temp }}/check
          retention-days: 14

  # The Windows build as the team makes it, from Linux with cargo-xwin: the Windows lint
  # (scripts/check.sh --windows) and a test package (scripts/package-windows.sh), which also
  # cross-builds the static musl helper rbrowser-wsl into the package (RB-030-04). The ZIP
  # stays a week as an artifact of the run.
  windows-cross:
    needs: preflight
    if: inputs.platforms != 'linux' && inputs.platforms != 'macos'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the cross-build packages
        run: scripts/ci-tools.sh cross
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: windows-cross
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-xwin@0.23.1,wasm-tools@1.261.0
      - name: scripts/check.sh --windows
        env:
          RB_CHECK_LOGS: ${{ runner.temp }}/check
        run: scripts/check.sh --windows
      # Into artifacts/plugins/, which exists even while plugins/ has none.
      - name: The plugins, unsigned
        run: mkdir -p artifacts/plugins && scripts/build-plugins.sh --unsigned
      # Builds the front ends it ships - the shell UI, the sync agent build.rs embeds and the
      # sidecar (`npm ci --ignore-scripts`) - then the app, and packs the ZIP.
      - name: scripts/package-windows.sh --profile release-test
        run: scripts/package-windows.sh --profile release-test --plugins artifacts/plugins
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release-test
          path: artifacts/windows/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload the check logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-cross-check-logs
          path: ${{ runner.temp }}/check
          retention-days: 14

  # The MSI (RB-099-01, RB-099-27) from the ZIP windows-cross packed, with WiX 5 - which runs on
  # Windows only - at its pin (scripts/ci-tools.sh wix; .NET is on the image): scripts/package-msi.sh
  # unpacks the ZIP and builds rbrowser-<version>-windows-x64.msi, kept a week beside the ZIP. Then
  # the smoke: a per-user install (Scope="perUser", no elevation asked) into
  # %LOCALAPPDATA%\Programs\rBrowser, its install-kind says `msi`, rbrowser.com answers --version,
  # and the uninstall leaves no folder behind. msiexec's logs stay two weeks when a step fails.
  windows-msi:
    needs: windows-cross
    if: inputs.platforms != 'linux' && inputs.platforms != 'macos'
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-release-test
          path: artifacts/windows
      - name: Install WiX (pinned)
        run: scripts/ci-tools.sh wix
      - name: scripts/package-msi.sh
        run: |
          set -euo pipefail
          zips=(artifacts/windows/rbrowser-*-windows-x64.zip)
          [[ ${#zips[@]} -eq 1 && -f "${zips[0]}" ]] || { echo "::error::not one package ZIP: ${zips[*]}"; exit 1; }
          scripts/package-msi.sh "${zips[0]}" "${zips[0]%.zip}.msi"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-msi-release-test
          path: artifacts/windows/*.msi
          if-no-files-found: error
          retention-days: 7
      - name: The MSI smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-Item artifacts/windows/rbrowser-*-windows-x64.msi)
          if ($msi.Count -ne 1) { throw "not one MSI: $msi" }
          $msi = $msi[0].FullName
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\rBrowser'
          $logs = Join-Path $env:RUNNER_TEMP 'msi-logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          function Invoke-Msiexec([string]$action, [string]$log) {
            $arguments = @($action, "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$(Join-Path $logs $log)`"")
            $process = Start-Process -FilePath msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "msiexec $action exited $($process.ExitCode)" }
          }
          if (Test-Path $dir) { throw "$dir exists before the install" }
          Invoke-Msiexec '/i' 'install.log'
          if (-not (Test-Path (Join-Path $dir 'rbrowser.exe'))) { throw "no rbrowser.exe in $dir" }
          $kind = (Get-Content -Raw (Join-Path $dir 'install-kind')).Trim()
          if ($kind -ne 'msi') { throw "install-kind says '$kind', not 'msi'" }
          & (Join-Path $dir 'rbrowser.com') --version
          if ($LASTEXITCODE -ne 0) { throw "rbrowser.com --version exited $LASTEXITCODE" }
          Invoke-Msiexec '/x' 'uninstall.log'
          if (Test-Path $dir) {
            Get-ChildItem -Recurse -Force $dir | ForEach-Object { $_.FullName }
            throw "the uninstall left $dir behind"
          }
      - name: Upload msiexec's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msi-logs
          path: ${{ runner.temp }}/msi-logs
          retention-days: 14

  # Clippy and every test natively on Windows with MSVC (scripts/check.sh --rust in Git Bash):
  # the cfg(windows) code compiled and run where it ships, not only linted.
  windows:
    needs: preflight
    if: inputs.platforms != 'linux' && inputs.platforms != 'macos'
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: windows
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest@0.9.151
      - name: scripts/check.sh --rust
        env:
          RB_CHECK_LOGS: ${{ runner.temp }}/check
        run: scripts/check.sh --rust
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-windows
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the check logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-check-logs
          path: ${{ runner.temp }}/check
          retention-days: 14

  # The macOS test build (RB-090-15): rBrowser.app for Apple Silicon and for Intel, each built
  # natively with the pinned Node runtime and the sidecar in Contents/Resources (RB-097-01), ad hoc
  # signed and checked (scripts/package-macos.sh: the structure test, `codesign --verify --deep
  # --strict`, the bundled sidecar started once, a size report), kept a week as a ZIP and a DMG;
  # then the app crate and rb-sidecar under clippy on macOS, where their cfg(target_os = "macos")
  # code compiles, and rb-sidecar's tests (its bundle path search) - after the upload, so a lint
  # never withholds a bundle. Only on a push to a `ci/*` branch or when asked for:
  #   gh workflow run ci.yml --ref ci/<name> -f platforms=macos
  macos:
    needs: preflight
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.platforms == 'macos')
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            os: macos-15
          - arch: x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scripts want bash 4 or later (macOS ships 3.2); CEF's wrapper builds with Ninja.
      - name: Install bash and ninja
        run: brew install bash ninja
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: macos-${{ matrix.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: wasm-tools@1.261.0
      - name: The plugins, unsigned
        run: mkdir -p artifacts/plugins && scripts/build-plugins.sh --unsigned
      - name: scripts/package-macos.sh --profile release-test
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/package-macos.sh --profile release-test --arch "${ARCH}" --plugins artifacts/plugins
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}-release-test
          path: |
            artifacts/macos/*.zip
            artifacts/macos/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Clippy on the app for macOS
        run: cargo clippy --locked -p rbrowser -p rb-sidecar --all-targets -- -D warnings
      # rb-sidecar's bundle path search (layout_tests) and the rest of its tests on macOS.
      - name: rb-sidecar's tests on macOS
        run: cargo test --locked -p rb-sidecar
