name: Release plugins

# The signed plugins of a release, called by release.yml's `plugins` job (RB-090-79, after
# rDownloader's release-plugins.yml): every first-party plugin built as a wasm component, signed
# with the plugin release key rbrowser-plugin-v1, and the official catalogue's index
# `rbrowser-plugin-index.json` (RB-091-01) signed with the same key - its public half is the root
# the app already verifies the packages with (`crates/rb-plugin-host/src/sign/roots.rs`), so the
# catalogue needs no key of its own. The index lists the catalogue's plugins
# (`scripts/catalogue-plugins.sh`) at their addresses in the plugin release `plugins-v<version>`.
# Its artifacts (`plugins`, `plugin-index`) belong to the release run: `windows` and `macos` pack
# the packages, `plugin-release` publishes them and the index (the fixed release `plugin-index`).
#
# The key is written to a file only this job's runner sees, its variable unset at once, never
# echoed, and removed after the step; everything is built before the step that reads it, which
# runs no cargo (scripts/release-plugins.sh sign|index, scripts/lib/check_workflows.py).
on:
  workflow_call:
    secrets:
      RBROWSER_PLUGIN_SIGNING_KEY: {required: true}

# Nothing by default; the job reads the tree only, the caller publishes the artifacts.
permissions: {}

# A re-run of a tag waits for the running one.
concurrency:
  group: release-plugins-${{ github.ref }}
  cancel-in-progress: false

env:
  # release.yml's, which a called workflow does not inherit.
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RB_NO_LOCK: 1
  RB_MIN_FREE_MB: 0
  # Days until the index expires; a release a quarter keeps it fresh (the app refuses an
  # expired index).
  INDEX_VALID_DAYS: 120

jobs:
  plugins:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the workspace version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: scripts/set-version.sh "${REF_NAME#v}" --check
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: wasm-tools@1.261.0
      # Compiled without the key: cargo runs the build scripts and proc macros of every
      # dependency here, and none of them may find the signing key. The components and
      # rb-plugin-pack are what the step below signs with.
      - name: Build the plugins and the packer
        run: mkdir -p artifacts/plugins && scripts/build-plugins.sh --unsigned
      - name: Sign the plugins and the catalogue's index
        env:
          RBROWSER_PLUGIN_SIGNING_KEY: ${{ secrets.RBROWSER_PLUGIN_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "${RBROWSER_PLUGIN_SIGNING_KEY}" ]]; then
            echo "::error::RBROWSER_PLUGIN_SIGNING_KEY is not set; a release ships signed plugins only"
            exit 1
          fi
          key="${RUNNER_TEMP}/plugin-signing.pem"
          trap 'rm -f "${key}"' EXIT
          (umask 077 && printf '%s\n' "${RBROWSER_PLUGIN_SIGNING_KEY}" > "${key}")
          # The key is in the file only from here on: no command below sees it in its environment.
          unset RBROWSER_PLUGIN_SIGNING_KEY
          scripts/release-plugins.sh sign "${key}"
          # RB-091-04: the published index, so the new one keeps every plugin's last version per
          # contract; none yet on the first release.
          previous="${RUNNER_TEMP}/previous-index"
          if gh release download plugin-index --pattern rbrowser-plugin-index.json \
              --dir "${previous}" --repo "${GITHUB_REPOSITORY}"; then
            export PREVIOUS_INDEX="${previous}/rbrowser-plugin-index.json"
          fi
          scripts/release-plugins.sh index "${key}" "${TAG}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugins
          path: artifacts/plugins/*.rbplugin
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-index
          path: artifacts/plugin-index/rbrowser-plugin-index.json
          if-no-files-found: error
          retention-days: 3
